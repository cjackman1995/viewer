<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CoopsGames — QR Sheet</title>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<style>
  :root{--fg:#15161a; --muted:#666; --line:#ddd; --accent:#15161a;
    --font:"Space Grotesk", ui-sans-serif, system-ui, sans-serif;
    --body:ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;}
  *{box-sizing:border-box}
  body{margin:0; background:#f4f4f5; color:var(--fg); font-family:var(--body)}
  .bar{position:sticky; top:0; background:#fff; border-bottom:1px solid var(--line);
    padding:14px 20px; display:flex; gap:12px; align-items:center; flex-wrap:wrap}
  .bar h1{font-family:var(--font); font-size:16px; margin:0 12px 0 0}
  .bar label{font-size:13px; color:var(--muted); display:flex; gap:7px; align-items:center}
  .bar input{border:1px solid var(--line); border-radius:8px; padding:8px 11px; font-size:13px;
    font-family:ui-monospace,monospace; width:360px; max-width:60vw}
  .bar button{margin-left:auto; background:var(--accent); color:#fff; border:none;
    border-radius:8px; padding:9px 16px; font-size:13px; font-weight:700; cursor:pointer; font-family:var(--body)}
  .sheet{max-width:900px; margin:22px auto; padding:0 18px 40px}
  .cards{display:grid; grid-template-columns:repeat(3, 1fr); gap:14px}
  .qrcard{background:#fff; border:1px solid var(--line); border-radius:12px;
    padding:16px 12px; text-align:center; break-inside:avoid}
  .qrcard canvas{width:160px !important; height:160px !important}
  .qrcard .nm{font-family:var(--font); font-weight:700; font-size:14px; margin:10px 0 2px; word-break:break-word}
  .qrcard .id{font-size:11px; color:var(--muted); font-family:ui-monospace,monospace}
  .note{max-width:900px; margin:0 auto 10px; padding:0 18px; color:var(--muted); font-size:12.5px}
  @media print{
    .bar,.note{display:none}
    body{background:#fff}
    .cards{grid-template-columns:repeat(3,1fr)}
    .sheet{margin:0}
  }
</style>
</head>
<body>
<div class="bar">
  <h1>QR Sheet</h1>
  <label>Site base URL
    <input id="base" placeholder="https://cjackman1995.github.io/viewer">
  </label>
  <button id="print">Print / Save as PDF</button>
</div>
<p class="note">Set your site's base URL (the folder that contains viewer.html), then print. Each code opens <code>viewer.html?m=&lt;id&gt;</code>.</p>
<div class="sheet"><div class="cards" id="cards"></div></div>

<script>
let MODELS = [];
const base = document.getElementById('base');
const cards = document.getElementById('cards');

// Default base guess: current folder
(function(){
  const u = new URL('.', location.href).href.replace(/\/$/,'');
  base.value = u.startsWith('http') ? u : '';
})();

function trimBase(){ return base.value.trim().replace(/\/+$/,''); }

function build(){
  cards.innerHTML = '';
  const b = trimBase();
  MODELS.forEach(m => {
    const url = b + '/viewer.html?m=' + encodeURIComponent(m.id);
    const card = document.createElement('div');
    card.className = 'qrcard';
    const cv = document.createElement('canvas');
    card.appendChild(cv);
    const nm = document.createElement('div'); nm.className='nm'; nm.textContent = m.name || m.id;
    const id = document.createElement('div'); id.className='id'; id.textContent = m.id;
    card.appendChild(nm); card.appendChild(id);
    cards.appendChild(card);
    try { QRCode.toCanvas(cv, url, { width:160, margin:1 }); } catch(e){}
  });
}

fetch('models.json', {cache:'no-cache'})
  .then(r => r.json())
  .then(data => { MODELS = Array.isArray(data) ? data : (data.models||[]); build(); })
  .catch(()=>{ cards.innerHTML = '<p style="color:#b00">Could not load models.json — put this file next to it.</p>'; });

base.addEventListener('input', build);
document.getElementById('print').addEventListener('click', ()=>window.print());
</script>
</body>
</html>
