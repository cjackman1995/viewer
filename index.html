<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CoopsGames — Model Catalog</title>
<style>
  :root{
    --bg:#15161a; --card:#1d1f25; --card-hover:#23262e; --line:#2e313a;
    --fg:#f2f3f5; --muted:#9aa0ab; --accent:#6ad1b4; --accent-ink:#04120d;
    --font:"Space Grotesk", ui-sans-serif, system-ui, sans-serif;
    --body:ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0; background:var(--bg); color:var(--fg); font-family:var(--body);
    -webkit-font-smoothing:antialiased;
    padding:env(safe-area-inset-top,0) max(18px,env(safe-area-inset-right,0)) 48px max(18px,env(safe-area-inset-left,0))}
  header{max-width:1000px; margin:0 auto; padding:30px 0 22px; display:flex;
    align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap}
  .brand{display:flex; align-items:center; gap:11px}
  .brand .dot{width:30px;height:30px;border-radius:8px;background:var(--accent);
    display:grid;place-items:center;color:var(--accent-ink);font-weight:800;font-family:var(--font)}
  .brand h1{font-family:var(--font); font-size:20px; margin:0; font-weight:700}
  .brand h1 span{color:var(--muted); font-weight:500}
  .search{background:#101116; border:1px solid var(--line); color:var(--fg);
    border-radius:10px; padding:10px 14px; font-size:14px; width:240px; max-width:100%; font-family:var(--body)}
  .grid{max-width:1000px; margin:0 auto; display:grid;
    grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); gap:16px}
  a.card{text-decoration:none; color:inherit; background:var(--card);
    border:1px solid var(--line); border-radius:14px; overflow:hidden; display:flex;
    flex-direction:column; transition:background .15s, border-color .15s, transform .15s}
  a.card:hover{background:var(--card-hover); border-color:#3a3e49; transform:translateY(-2px)}
  .thumb{aspect-ratio:4/3; background:radial-gradient(120% 110% at 50% 20%, #2a2d35, #16171b);
    display:grid; place-items:center}
  .thumb model-viewer{width:100%; height:100%; --poster-color:transparent}
  .thumb .ph{color:#434652; font-size:34px}
  .meta{padding:13px 15px}
  .meta .name{font-family:var(--font); font-weight:700; font-size:15px; margin:0 0 3px}
  .meta .desc{color:var(--muted); font-size:12.5px; margin:0; line-height:1.4;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
  .empty{max-width:1000px; margin:40px auto; color:var(--muted); text-align:center}
  footer{max-width:1000px; margin:36px auto 0; color:var(--muted); font-size:12.5px; text-align:center}
</style>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
</head>
<body>
<header>
  <div class="brand">
    <span class="dot">C</span>
    <h1>CoopsGames <span>· Catalog</span></h1>
  </div>
  <input class="search" id="search" placeholder="Search models…">
</header>

<div class="grid" id="grid"></div>
<div class="empty" id="empty" hidden>No models yet. Add entries to models.json.</div>
<footer id="count"></footer>

<script>
let MODELS = [];
const grid = document.getElementById('grid');
const empty = document.getElementById('empty');

function card(m){
  const a = document.createElement('a');
  a.className = 'card';
  a.href = 'viewer.html?m=' + encodeURIComponent(m.id);
  const thumb = document.createElement('div');
  thumb.className = 'thumb';
  if (m.poster){
    const img = document.createElement('img');
    img.src = m.poster; img.alt = m.name; img.style.cssText='width:100%;height:100%;object-fit:cover';
    thumb.appendChild(img);
  } else {
    // live interactive-free preview of the model itself
    const mv = document.createElement('model-viewer');
    mv.setAttribute('src', m.file);
    mv.setAttribute('camera-orbit','25deg 75deg auto');
    mv.setAttribute('interaction-prompt','none');
    mv.setAttribute('environment-image','neutral');
    mv.setAttribute('exposure','1.05');
    mv.setAttribute('loading','lazy');
    mv.setAttribute('disable-zoom','');
    thumb.appendChild(mv);
  }
  a.appendChild(thumb);
  const meta = document.createElement('div');
  meta.className = 'meta';
  meta.innerHTML = '<p class="name"></p><p class="desc"></p>';
  meta.querySelector('.name').textContent = m.name || m.id;
  meta.querySelector('.desc').textContent = m.description || '';
  a.appendChild(meta);
  return a;
}

function render(filter){
  grid.innerHTML = '';
  const f = (filter||'').toLowerCase().trim();
  const list = MODELS.filter(m =>
    !f || (m.name||'').toLowerCase().includes(f) || (m.id||'').toLowerCase().includes(f)
       || (m.description||'').toLowerCase().includes(f));
  list.forEach(m => grid.appendChild(card(m)));
  empty.hidden = list.length > 0;
  document.getElementById('count').textContent =
    MODELS.length ? list.length + ' of ' + MODELS.length + ' models' : '';
}

fetch('models.json', {cache:'no-cache'})
  .then(r => r.json())
  .then(data => { MODELS = Array.isArray(data) ? data : (data.models||[]); render(''); })
  .catch(() => { empty.hidden = false; empty.textContent = 'Could not load models.json.'; });

document.getElementById('search').addEventListener('input', e => render(e.target.value));
</script>
</body>
</html>
