<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Williams — 3D Viewer</title>

<!-- Google's model-viewer web component: handles GLB/GLTF, orbit, zoom, and AR. Pinned version. -->
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<!-- QR code generator (for the on-screen "Share" panel). -->
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>

<style>
  :root{
    --bg:#15161a; --bg-2:#1d1f25; --stage-1:#2a2d35; --stage-2:#17181c;
    --fg:#f2f3f5; --muted:#9aa0ab; --line:#2e313a;
    --accent:#E01820; --accent-ink:#ffffff;
    --radius:14px;
    --font: "Space Grotesk", ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    --body: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font-family:var(--body); -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column;
    padding-top:env(safe-area-inset-top,0); padding-bottom:env(safe-area-inset-bottom,0);
  }

  /* Top bar */
  header{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:14px max(16px,env(safe-area-inset-left,0)) 14px max(16px,env(safe-area-inset-right,0));
    border-bottom:1px solid var(--line); background:var(--bg-2); flex:0 0 auto; z-index:20;
  }
  .brand{display:flex; align-items:center; gap:10px; min-width:0}
  .brand .logo-chip{background:#fff;border-radius:7px;padding:5px 9px;display:inline-flex;align-items:center;flex:0 0 auto}
  .brand .logo-chip img{height:22px;width:auto;display:block}
  .brand .name{font-family:var(--font); font-weight:700; color:var(--muted);
    text-transform:uppercase; letter-spacing:1px; font-size:11.5px}
  .top-actions{display:flex; gap:8px; flex:0 0 auto}

  button{font-family:var(--body); cursor:pointer}
  .btn{
    border:1px solid var(--line); background:#23262e; color:var(--fg);
    padding:8px 13px; border-radius:10px; font-size:13.5px; font-weight:600;
    display:inline-flex; align-items:center; gap:7px; transition:background .15s, border-color .15s;
  }
  .btn:hover{background:#2b2f39; border-color:#3a3e49}
  .btn svg{width:15px;height:15px}
  .btn.active{border-color:var(--accent); color:#fff}

  /* Stage */
  main{position:relative; flex:1 1 auto; min-height:0}
  model-viewer{
    width:100%; height:100%;
    background:radial-gradient(130% 110% at 50% 18%, var(--stage-1) 0%, var(--stage-2) 70%);
    --poster-color:transparent;
  }
  /* Caption overlay, bottom-left */
  .caption{
    position:absolute; left:max(16px,env(safe-area-inset-left,0)); bottom:16px;
    max-width:min(420px, calc(100% - 32px)); pointer-events:none;
  }
  .caption .sub{margin:0 0 3px; font-size:11px; font-weight:700; letter-spacing:.8px;
    text-transform:uppercase; color:var(--accent); text-shadow:0 1px 8px rgba(0,0,0,.6)}
  .caption h1{font-family:var(--font); font-size:20px; margin:0 0 4px; font-weight:700; text-wrap:balance;
    text-shadow:0 1px 10px rgba(0,0,0,.5)}
  .caption p{margin:0; font-size:13.5px; color:#c7ccd4; line-height:1.45;
    text-shadow:0 1px 8px rgba(0,0,0,.6)}

  /* Loading bar */
  .progress{position:absolute; left:0; right:0; top:0; height:3px; background:transparent; overflow:hidden}
  .progress .fill{height:100%; width:0; background:var(--accent); transition:width .2s ease}
  .progress[hidden]{display:none}

  /* Hint chip */
  .hint{position:absolute; top:14px; left:50%; transform:translateX(-50%);
    background:rgba(20,21,26,.7); backdrop-filter:blur(6px);
    border:1px solid var(--line); color:var(--muted); font-size:12px;
    padding:6px 12px; border-radius:999px; transition:opacity .4s}

  /* Message state (not found / no model) */
  .message{position:absolute; inset:0; display:none; place-items:center; text-align:center; padding:24px}
  .message.show{display:grid}
  .message .card{max-width:360px}
  .message h2{font-family:var(--font); margin:0 0 8px; font-size:20px}
  .message p{color:var(--muted); margin:0 0 18px; line-height:1.5}

  /* Details / specs panel */
  .panel{
    position:absolute; top:0; right:0; height:100%; width:min(380px, 92vw);
    background:var(--bg-2); border-left:1px solid var(--line);
    transform:translateX(100%); transition:transform .25s ease;
    display:flex; flex-direction:column; z-index:30; box-shadow:-18px 0 40px rgba(0,0,0,.35);
  }
  .panel.open{transform:translateX(0)}
  .panel-head{display:flex; align-items:flex-start; justify-content:space-between; gap:10px;
    padding:18px 18px 14px; border-bottom:1px solid var(--line); flex:0 0 auto}
  .panel-head .sub{margin:0 0 4px; font-size:11px; font-weight:700; letter-spacing:.8px;
    text-transform:uppercase; color:var(--accent)}
  .panel-head h2{font-family:var(--font); margin:0; font-size:19px; font-weight:700}
  .panel-head .shown{color:var(--muted); font-size:12px; margin:3px 0 0}
  .panel-x{border:none; background:transparent; color:var(--muted); font-size:22px; line-height:1;
    padding:2px 6px; border-radius:8px}
  .panel-x:hover{background:#2b2f39; color:var(--fg)}
  .panel-body{overflow-y:auto; padding:16px 18px 24px; flex:1 1 auto}
  .panel-body h3{font-family:var(--font); font-size:12px; letter-spacing:1px; text-transform:uppercase;
    color:var(--muted); margin:20px 0 10px; font-weight:700}
  .panel-body h3:first-child{margin-top:0}
  .lede{color:#c7ccd4; font-size:13.5px; line-height:1.55; margin:0}

  table.specs{width:100%; border-collapse:collapse; font-size:13.5px}
  table.specs td{padding:9px 0; border-bottom:1px solid var(--line); vertical-align:top}
  table.specs td.k{color:var(--muted); padding-right:12px; white-space:nowrap}
  table.specs td.v{text-align:right; font-weight:600; font-family:var(--font)}

  .chips{display:flex; flex-wrap:wrap; gap:7px}
  .chip{background:#23262e; border:1px solid var(--line); color:#c7ccd4;
    font-size:12px; padding:5px 10px; border-radius:999px}

  .docs{display:flex; flex-direction:column; gap:8px}
  .doc{display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--fg);
    background:#23262e; border:1px solid var(--line); border-radius:10px; padding:11px 13px;
    font-size:13.5px; font-weight:600; transition:background .15s, border-color .15s}
  .doc:hover{background:#2b2f39; border-color:var(--accent)}
  .doc svg{width:17px; height:17px; color:var(--accent); flex:0 0 auto}

  .cta{display:block; text-align:center; text-decoration:none; margin-top:22px;
    background:var(--accent); color:#fff; font-weight:700; font-family:var(--font);
    padding:12px; border-radius:11px; font-size:14px}
  .cta:hover{background:#c21019}

  /* Share modal */
  .overlay{position:fixed; inset:0; background:rgba(8,9,12,.72); display:none;
    place-items:center; padding:20px; z-index:50}
  .overlay.show{display:grid}
  .sheet{background:var(--bg-2); border:1px solid var(--line); border-radius:var(--radius);
    width:min(380px,100%); padding:22px; text-align:center}
  .sheet h3{font-family:var(--font); margin:0 0 4px; font-size:17px}
  .sheet .subt{color:var(--muted); font-size:13px; margin:0 0 16px}
  .qr-wrap{background:#fff; border-radius:12px; padding:14px; display:inline-block; margin-bottom:16px}
  .qr-wrap canvas{display:block}
  .link-row{display:flex; gap:8px; margin-bottom:14px}
  .link-row input{flex:1; min-width:0; background:#101116; border:1px solid var(--line);
    color:var(--fg); border-radius:9px; padding:9px 11px; font-size:12.5px; font-family:ui-monospace,monospace}
  .btn-primary{width:100%; justify-content:center; background:var(--accent); color:#fff;
    border-color:transparent; font-weight:700}
  .btn-primary:hover{background:#c21019}
  .toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:var(--accent); color:#fff; font-weight:700; font-size:13px;
    padding:10px 18px; border-radius:999px; opacity:0; transition:opacity .2s; z-index:60; pointer-events:none}
  .toast.show{opacity:1}

  a.link{color:var(--accent); text-decoration:none; font-weight:600}
  a.link:hover{text-decoration:underline}

  @media (max-width:640px){
    .brand .name{display:none}
    .btn .lbl{display:none}
    .btn{padding:9px 11px}
    .caption h1{font-size:17px}
    /* panel becomes a bottom sheet */
    .panel{top:auto; bottom:0; left:0; right:0; width:100%; height:auto; max-height:78%;
      border-left:none; border-top:1px solid var(--line); border-radius:16px 16px 0 0;
      transform:translateY(100%); box-shadow:0 -18px 40px rgba(0,0,0,.4)}
    .panel.open{transform:translateY(0)}
  }
</style>
</head>

    <span class="name">3D Viewer</span>
  </a>
  <div class="top-actions">
    <button class="btn" id="detailsBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/></svg>
      <span class="lbl">Details</span>
    </button>
    <button class="btn" id="arBtn" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2 4 6v12l8 4 8-4V6z"/><path d="M4 6l8 4 8-4M12 10v12"/></svg>
      <span class="lbl">View in your space</span>
    </button>
    <button class="btn" id="shareBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>
      <span class="lbl">Share</span>
    </button>
  </div>
</header>

<main>
  <div class="progress" id="progress"><div class="fill" id="progressFill"></div></div>

  <model-viewer id="mv"
    camera-controls
    touch-action="pan-y"
    auto-rotate auto-rotate-delay="3000" rotation-per-second="18deg"
    interaction-prompt="none"
    shadow-intensity="1" shadow-softness="0.8"
    exposure="1.05" tone-mapping="neutral"
    environment-image="neutral"
    ar ar-modes="webxr scene-viewer quick-look" ar-scale="fixed"
    loading="eager" reveal="auto">
  </model-viewer>

  <div class="hint" id="hint">Drag to rotate · scroll to zoom</div>

  <div class="caption" id="caption" hidden>
    <p class="sub" id="mSub"></p>
    <h1 id="mTitle"></h1>
    <p id="mTag"></p>
  </div>

  <!-- Details / specs panel -->
  <aside class="panel" id="panel" aria-hidden="true">
    <div class="panel-head">
      <div>
        <p class="sub" id="pSub"></p>
        <h2 id="pTitle"></h2>
        <p class="shown" id="pShown"></p>
      </div>
      <button class="panel-x" id="panelClose" aria-label="Close details">&times;</button>
    </div>
    <div class="panel-body" id="panelBody"></div>
  </aside>

  <div class="message" id="message">
    <div class="card">
      <h2 id="msgTitle">Model not found</h2>
      <p id="msgBody">This link doesn't point to a model in the catalog.</p>
      <a class="link" href="index.html">Browse the catalog →</a>
    </div>
  </div>
</main>

<!-- Share / QR modal -->
<div class="overlay" id="overlay">
  <div class="sheet">
    <h3 id="shareTitle">Share this model</h3>
    <p class="subt">Scan the code or copy the link.</p>
    <div class="qr-wrap"><canvas id="qr"></canvas></div>
    <div class="link-row">
      <input id="shareUrl" readonly>
      <button class="btn" id="copyBtn">Copy</button>
    </div>
    <button class="btn-primary btn" id="closeBtn">Done</button>
  </div>
</div>

<div class="toast" id="toast">Link copied</div>

<script>
(function(){
  const qs = new URLSearchParams(location.search);
  const mv = document.getElementById('mv');
  const caption = document.getElementById('caption');
  const message = document.getElementById('message');
  const progress = document.getElementById('progress');
  const progressFill = document.getElementById('progressFill');
  const hint = document.getElementById('hint');
  const arBtn = document.getElementById('arBtn');
  const detailsBtn = document.getElementById('detailsBtn');
  const panel = document.getElementById('panel');
  const panelBody = document.getElementById('panelBody');

  // --- Contact / quote target (edit to your real address) ---
  const SALES_EMAIL = 'sales@williamscrusher.com';

  function esc(s){ return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function showMessage(title, body){
    document.getElementById('msgTitle').textContent = title;
    document.getElementById('msgBody').textContent = body;
    message.classList.add('show');
    progress.hidden = true;
    hint.style.display = 'none';
    detailsBtn.style.display = 'none';
  }

  let CURRENT = null;

  function buildPanel(entry){
    const rows = (entry.specs||[]).map(s =>
      '<tr><td class="k">'+esc(s.label)+'</td><td class="v">'+esc(s.value)+'</td></tr>').join('');
    const chips = (entry.applications||[]).map(a => '<span class="chip">'+esc(a)+'</span>').join('');
    const docs = (entry.documents||[]).map(d =>
      '<a class="doc" href="'+esc(d.file)+'" target="_blank" rel="noopener">'+
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>'+
      esc(d.label)+'</a>').join('');

    let html = '';
    if (entry.description) html += '<p class="lede">'+esc(entry.description)+'</p>';
    if (rows) html += '<h3>Specifications</h3><table class="specs"><tbody>'+rows+'</tbody></table>';
    if (chips) html += '<h3>Applications</h3><div class="chips">'+chips+'</div>';
    if (docs) html += '<h3>Downloads</h3><div class="docs">'+docs+'</div>';

    const subj = encodeURIComponent('Quote request — ' + (entry.name||'Williams equipment'));
    html += '<a class="cta" href="mailto:'+SALES_EMAIL+'?subject='+subj+'">Request a quote</a>';
    panelBody.innerHTML = html;

    document.getElementById('pSub').textContent = entry.subcategory || entry.category || '';
    document.getElementById('pTitle').textContent = entry.name || '';
    document.getElementById('pShown').textContent = entry.shown || '';
  }

  function openPanel(){ panel.classList.add('open'); panel.setAttribute('aria-hidden','false'); detailsBtn.classList.add('active'); }
  function closePanel(){ panel.classList.remove('open'); panel.setAttribute('aria-hidden','true'); detailsBtn.classList.remove('active'); }
  detailsBtn.addEventListener('click', () => panel.classList.contains('open') ? closePanel() : openPanel());
  document.getElementById('panelClose').addEventListener('click', closePanel);

  function loadModel(entry){
    CURRENT = entry;
    mv.src = entry.file;
    if (entry.iosSrc) mv.setAttribute('ios-src', entry.iosSrc); // USDZ for iOS AR, optional
    if (entry.poster) mv.setAttribute('poster', entry.poster);
    mv.alt = entry.name || 'Williams equipment model';

    document.getElementById('mSub').textContent = entry.subcategory || entry.category || '';
    document.getElementById('mTitle').textContent = entry.name || '';
    document.getElementById('mTag').textContent = entry.tagline || '';
    if (entry.name || entry.tagline) caption.hidden = false;

    document.title = (entry.name ? entry.name + ' · ' : '') + 'Williams 3D Viewer';
    document.getElementById('shareTitle').textContent = entry.name ? 'Share ' + entry.name : 'Share this model';

    const hasDetails = (entry.description || (entry.specs&&entry.specs.length) ||
      (entry.applications&&entry.applications.length) || (entry.documents&&entry.documents.length));
    if (hasDetails) buildPanel(entry); else detailsBtn.style.display = 'none';
  }

  // Resolve which model to show.
  // 1) ?src=<direct URL to a .glb>  (quick one-off, no manifest needed)
  // 2) ?m=<id>  -> look it up in models.json
  const directSrc = qs.get('src');
  const id = qs.get('m');

  if (directSrc) {
    loadModel({ file: directSrc, name: qs.get('name') || '', tagline: qs.get('desc') || '' });
    detailsBtn.style.display = 'none';
  } else if (id) {
    fetch('models.json', {cache:'no-cache'})
      .then(r => { if(!r.ok) throw new Error('manifest'); return r.json(); })
      .then(data => {
        const list = Array.isArray(data) ? data : (data.models || []);
        const entry = list.find(x => x.id === id);
        if (!entry) { showMessage('Model not found', 'No model with id “'+id+'” is in the catalog yet.'); return; }
        loadModel(entry);
      })
      .catch(() => showMessage('Catalog unavailable', 'Could not load the model list. Check that models.json is published next to this page.'));
  } else {
    showMessage('No model selected', 'Add ?m=<id> to the link, or open the catalog to pick one.');
  }

  // Loading progress + AR availability
  mv.addEventListener('progress', e => {
    const p = e.detail.totalProgress;
    progress.hidden = false;
    progressFill.style.width = Math.round(p*100) + '%';
    if (p >= 1) setTimeout(()=>{ progress.hidden = true; }, 300);
  });
  mv.addEventListener('load', () => {
    if (mv.canActivateAR) arBtn.hidden = false;
    setTimeout(()=>{ hint.style.opacity = '0'; }, 4000);
  });
  mv.addEventListener('error', () => showMessage('Could not load model', 'The model file failed to load. It may be missing or blocked by the host.'));
  arBtn.addEventListener('click', () => mv.activateAR());

  // ---- Share / QR ----
  const overlay = document.getElementById('overlay');
  const shareUrlInput = document.getElementById('shareUrl');
  const toast = document.getElementById('toast');

  function openShare(){
    const url = location.href;
    shareUrlInput.value = url;
    try {
      QRCode.toCanvas(document.getElementById('qr'), url, { width: 220, margin: 1,
        color: { dark:'#15161a', light:'#ffffff' } });
    } catch(e){}
    overlay.classList.add('show');
  }
  document.getElementById('shareBtn').addEventListener('click', openShare);
  document.getElementById('closeBtn').addEventListener('click', ()=>overlay.classList.remove('show'));
  overlay.addEventListener('click', e => { if(e.target===overlay) overlay.classList.remove('show'); });

  document.getElementById('copyBtn').addEventListener('click', () => {
    const v = shareUrlInput.value;
    const done = () => { toast.classList.add('show'); setTimeout(()=>toast.classList.remove('show'),1400); };
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(v).then(done).catch(()=>{ shareUrlInput.select(); document.execCommand('copy'); done(); });
    } else { shareUrlInput.select(); document.execCommand('copy'); done(); }
  });
})();
</script>
</body>
</html>
